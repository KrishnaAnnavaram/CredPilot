[project]
name = "credpilot"
version = "0.1.0"
description = "Loan Origination & Underwriting Copilot — multi-product agentic RAG over synthetic lending policy"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["src", "mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"
