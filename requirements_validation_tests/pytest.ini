[pytest]
# The validation suite is rooted here and never collects tests from the CredPilot
# implementation. The implementation's own tests are ARTIFACTS this suite inspects
# (tests/test_routing.py, tests/test_loops.py, tests/test_tool_contracts.py,
# tests/test_memory_persistence.py) - they are not run as part of validating it.
testpaths = automated_tests
norecursedirs = source_document source_requirements traceability reports test_specs manual_evidence config .git __pycache__
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    requirement(req_id): the requirement this test validates
    verification(kind): the verification method used
