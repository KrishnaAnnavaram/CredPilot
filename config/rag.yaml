# CredPilot retrieval configuration.
#
# Every ranking parameter the pipeline uses is declared here, so a benchmark can
# change one value and a rebuild reproduces exactly. No secrets live in this file.
#
# Model choices carry the benchmark that selected them; see
# docs/rag/EMBEDDING_BENCHMARK.md and docs/rag/RERANKER_BENCHMARK.md.

rag:
  vectorstore:
    type: chroma
    path: data/vectorstore/credpilot
    lexical_path: data/vectorstore/lexical
    manifest_path: data/vectorstore/index_manifest.json

  embedding:
    provider: sentence-transformers
    # Chosen by measurement, not by starting assumption. This work began on
    # BAAI/bge-small-en-v1.5; the benchmark in eval/results/embedding_benchmark.json
    # put e5-base-v2 ahead of it on macro rule Recall@5 (0.9756 vs 0.9640) and on
    # macro policy Recall@5 (0.9932 vs 0.9865), at the same query latency.
    # See docs/rag/EMBEDDING_BENCHMARK.md for the margin and what it costs.
    model: intfloat/e5-base-v2
    dimension: 768
    normalize: true
    distance: cosine
    # E5 requires "query: " / "passage: " prefixes; BGE v1.5 wants an asymmetric
    # query instruction and no passage prefix. The convention travels with the
    # model name rather than being a caller's responsibility — see
    # src/rag/embedding.py, which would silently cost recall if it did not.
    batch_size: 32

  reranker:
    enabled: true
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    batch_size: 32

  chunking:
    # A rule plus its thresholds, applicability and exceptions is the preferred
    # retrieval unit. Secondary splitting only fires above max_chars, and then
    # only at paragraph boundaries, with the parent heading repeated.
    max_chars: 4200
    split_overlap_chars: 200
    min_chars: 40

  retrieval:
    # Funnel widths chosen by measurement, not intuition. The sweep in
    # eval/results/pipeline_sweep.json shows recall is flat-to-worse as the
    # funnel widens — more candidates give the cross-encoder more chances to
    # promote a plausible-but-wrong rule — while p95 latency grows four-fold.
    # See docs/rag/RETRIEVAL_ABLATION.md.
    dense_top_k: 15
    lexical_top_k: 15
    fusion_top_k: 12
    # A floor, not a cap: the pipeline reranks at least `final_top_k` candidates
    # whatever this says, so a large caller-supplied top_k is still honoured.
    rerank_top_k: 10
    final_top_k: 6
    rrf_k: 60
    dense_weight: 1.0
    lexical_weight: 1.0
    # Deterministic synonym expansion of the query for the lexical layer only.
    query_expansion: true
    # Drop reranked evidence below this cross-encoder score when better evidence
    # exists. Never used to empty a result set on its own.
    min_reranker_score: -8.0

  dedupe:
    # Keep at most this many chunks from one (policy, version, rule) group.
    max_per_rule: 1
    # Rule and section chunks from one policy document. Document OVERVIEW chunks
    # are budgeted separately by max_overview so they cannot starve the rules
    # underneath them.
    max_per_policy: 3
    max_overview: 2

  products:
    mortgage:
      domain: MORTGAGE
      corpus_root: synthetic_data/mortgage/policy_corpus
      collection: credpilot_mortgage_policies
      parser: mortgage
      temporal_filtering: true
      final_top_k: 6

    education:
      domain: EDUCATION_LOAN
      corpus_root: synthetic_data/education/policy_corpus
      collection: credpilot_education_policies
      parser: education
      # The education corpus publishes one version per document with an
      # effective_date and no expiration or supersession chain. Effective-date
      # filtering is applied; version selection has nothing to select between.
      # See docs/rag/TEMPORAL_RETRIEVAL.md.
      temporal_filtering: true
      final_top_k: 6

# Candidate models the benchmarks sweep. The selected model above must be one of
# these and must be justified by eval/results/*.json.
benchmark:
  embedding_models:
    - BAAI/bge-small-en-v1.5
    - sentence-transformers/all-MiniLM-L6-v2
    - intfloat/e5-base-v2
    - BAAI/bge-base-en-v1.5
  reranker_models:
    - cross-encoder/ms-marco-MiniLM-L-6-v2
    - cross-encoder/ms-marco-MiniLM-L-12-v2
    - BAAI/bge-reranker-base
