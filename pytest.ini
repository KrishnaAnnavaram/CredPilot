[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers --tb=short -p no:phoenix -p no:langsmith_plugin
markers =
    slow: exercises the full retrieval pipeline (loads the embedding and reranker models)
    integration: crosses a process or subsystem boundary (MCP, LangGraph, Chroma)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
